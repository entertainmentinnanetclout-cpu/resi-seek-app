name: Golden Search SEO Quality

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - seo/**

jobs:
  seo-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Golden Search static QA
        run: node scripts/seo-qa.mjs

      - name: Production build
        run: npm run build
