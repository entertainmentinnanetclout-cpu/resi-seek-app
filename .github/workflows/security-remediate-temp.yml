name: Dependency Security Remediation

on:
  push:
    branches:
      - fix/security-audit-mobile-reservation-popup

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-audit-mobile-reservation-popup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply non-breaking security fixes
        run: npm audit fix || true
      - name: Remove obsolete development tagger
        run: npm uninstall lovable-tagger
      - name: Upgrade build and router security boundaries
        run: npm install --save-dev vite@8.2.2 @vitejs/plugin-react-swc@4.3.3 && npm install vite-plugin-pwa@1.3.0 react-router-dom@7.18.3
      - name: Require zero audit findings
        run: npm audit --audit-level=low
      - name: Production build
        run: npm run build
      - name: Commit dependency remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "fix(security): eliminate npm audit vulnerabilities"
            git push origin HEAD:fix/security-audit-mobile-reservation-popup
          fi
