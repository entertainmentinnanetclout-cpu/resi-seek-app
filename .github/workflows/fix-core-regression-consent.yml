name: Fix Core Regression Consent

on:
  push:
    branches: [upgrade/nsfas-compliance-meta-pixel]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Handle marketing consent in P1-P4 core regression'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/nsfas-compliance-meta-pixel
          fetch-depth: 0

      - name: Patch core regression consent handling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/p1-p4-core-regression.mjs')
          text = path.read_text()
          old = '''  await page.goto(origin+"/auth");
          await page.getByLabel("Email address *").fill(user.email);'''
          new = '''  await page.goto(origin+"/auth");
          const marketingPreferences=page.getByRole("dialog",{name:"Marketing privacy preferences"});
          if (await marketingPreferences.isVisible().catch(()=>false)) {
            await marketingPreferences.getByRole("button",{name:"Essential only",exact:true}).click();
            await marketingPreferences.waitFor({state:"hidden"});
            console.log("PASS marketing consent does not block P1-P4 authentication flow");
          }
          await page.getByLabel("Email address *").fill(user.email);'''
          if old not in text:
              raise SystemExit('Expected authentication anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/p1-p4-core-regression.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Handle marketing consent in P1-P4 core regression"
          git push origin HEAD:upgrade/nsfas-compliance-meta-pixel
