name: Temporary dependency lock autofix

on:
  push:
    paths:
      - ".github/workflows/dependency-lock-autofix.yml"

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout dependency fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/dependency-audit-20260930
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh vulnerable transitive lock entries
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Verify zero known vulnerabilities
        run: npm audit --audit-level=low
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "fix(security): refresh patched transitive dependencies"
          git push origin HEAD:fix/dependency-audit-20260930
