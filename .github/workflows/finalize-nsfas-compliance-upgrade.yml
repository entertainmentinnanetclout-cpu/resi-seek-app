name: Finalize NSFAS Compliance Upgrade

on:
  push:
    branches: [upgrade/nsfas-compliance-meta-pixel]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'Finalize NSFAS compliance and Meta Pixel upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/nsfas-compliance-meta-pixel
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wire public portal SEO and Meta Pixel modules
        run: python scripts/finalize-nsfas-compliance-upgrade.py

      - name: Format touched files
        run: npx prettier --write src/App.tsx src/components/SiteHeader.tsx src/components/SiteFooter.tsx src/components/MetaPixelTracker.tsx src/lib/metaPixel.ts src/lib/compliance/nsfasStandards.ts src/pages/public/AccreditationReadiness.tsx src/pages/public/StudentAccommodation.tsx src/pages/public/PartnersLandlords.tsx src/pages/seo/NsfAsLanding.tsx src/pages/residence/ResidenceLayout.tsx src/pages/residence/ResidenceComplianceReadiness.tsx scripts/prerender-seo.mjs api/sitemap.js vercel.json

      - name: Production build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee lint-output.txt

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nsfas-upgrade-lint-diagnostics
          path: lint-output.txt
          if-no-files-found: ignore

      - name: Enforce lint gate
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Commit finalized upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/SiteHeader.tsx src/components/SiteFooter.tsx src/pages/residence/ResidenceLayout.tsx scripts/prerender-seo.mjs api/sitemap.js vercel.json
          git diff --cached --quiet && exit 0
          git commit -m "Finalize NSFAS compliance and Meta Pixel upgrade"
          git push origin HEAD:upgrade/nsfas-compliance-meta-pixel
