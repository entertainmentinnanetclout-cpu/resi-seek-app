name: AdminOS Release Gate Final
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: adminos-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: SEO quality
        run: npm run seo:check
      - name: Production build
        run: npm run build
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: adminos-production-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 1
      - name: Dependency security
        run: npm audit --omit=dev --audit-level=high
