name: ResKonnect runtime Edge regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  otp-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scripts/phone-verification-security-event.test.mjs scripts/luna-demand-snapshot-status.test.mjs
