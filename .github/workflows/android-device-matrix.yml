name: Android Device Matrix

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "native/**"
      - "src/**"
      - "capacitor.config.*"
      - "package*.json"
      - ".github/workflows/android-device-matrix.yml"

permissions:
  contents: read

jobs:
  renderer-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 29
            profile: pixel_2
          - api-level: 35
            profile: pixel_c
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install web dependencies
        run: npm ci
      - name: Install pinned Capacitor toolchain
        run: npm install --no-save --package-lock=false @capacitor/core@8.5.0 @capacitor/android@8.5.0 @capacitor/cli@8.5.0 @capacitor/geolocation@8.0.0 @capacitor/local-notifications@8.0.0
      - name: Build native web bundle
        env:
          RK_NATIVE_BUILD: "1"
        run: npm run build
      - name: Sync Android
        run: npx cap sync android
      - name: Run renderer recovery instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: gradle -p android connectedDebugAndroidTest --stacktrace
