name: Android Play Store Signed Release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Play versionCode (must increase every upload)"
        required: true
        default: "6"
      version_name:
        description: "Public versionName"
        required: true
        default: "1.1.3"

permissions:
  contents: read

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: play-store
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          packages: ""

      - name: Install Android 16 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Validate protected signing inputs
        env:
          KEYSTORE_B64: ${{ secrets.RK_ANDROID_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RK_ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RK_ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RK_ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Materialize upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.RK_ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/reskonnect-upload.jks"
          chmod 600 "$RUNNER_TEMP/reskonnect-upload.jks"
          echo "RK_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/reskonnect-upload.jks" >> "$GITHUB_ENV"

      - name: Install locked web dependencies
        run: npm ci

      - name: Strict Play readiness audit
        run: node scripts/android-playstore-readiness.mjs --strict

      - name: Install pinned Capacitor 8.5.0 and native geolocation toolchain
        run: npm install --no-save --package-lock=false @capacitor/core@8.5.0 @capacitor/android@8.5.0 @capacitor/cli@8.5.0 @capacitor/geolocation@8.0.0

      - name: Build production web bundle
        env:
          RK_NATIVE_BUILD: "1"
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build signed Play AAB
        env:
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
          RK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RK_ANDROID_UPLOAD_STORE_PASSWORD }}
          RK_ANDROID_KEY_ALIAS: ${{ secrets.RK_ANDROID_UPLOAD_KEY_ALIAS }}
          RK_ANDROID_KEY_PASSWORD: ${{ secrets.RK_ANDROID_UPLOAD_KEY_PASSWORD }}
        run: gradle -p android bundleRelease --stacktrace

      - name: Verify AAB signature
        run: jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab

      - name: Generate release checksum
        run: sha256sum android/app/build/outputs/bundle/release/app-release.aab | tee android/app/build/outputs/bundle/release/app-release.aab.sha256

      - name: Upload signed Play artifact
        uses: actions/upload-artifact@v4
        with:
          name: reskonnect-play-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 30
