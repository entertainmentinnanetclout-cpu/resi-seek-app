name: Finalize Providerless Notifications
on:
  push:
    branches: [feat/android-providerless-notifications]
    paths:
      - ".github/workflows/finalize-providerless-notifications.yml"
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/android-providerless-notifications
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Bump Android release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          version_files = [
            'scripts/android-v110-reliability-qa.mjs',
            'scripts/p12-release-candidate-audit.mjs',
            'scripts/android-playstore-readiness.mjs',
            'scripts/p1-p4-stability-audit.mjs',
            'scripts/android-rg3-rg6-qa.mjs',
            'src/lib/runtimeTelemetry.ts',
            'docs/P9_P12_RELEASE_CANDIDATE_2026-09-30.md',
            'android/app/build.gradle',
          ]
          for name in version_files:
            p=Path(name); s=p.read_text()
            for old,new in [
              ('1.1.7','1.1.8'),('versionCode 10','versionCode 11'),
              ('versionCode===10','versionCode===11'),('versionCode === 10','versionCode === 11'),
              ('versionCode >= 10','versionCode >= 11'),('versionCode >=10','versionCode >=11'),
              ('release.versionCode, 10','release.versionCode, 11'),('?: "10"','?: "11"')
            ]: s=s.replace(old,new)
            p.write_text(s)
          rel=Path('native/android-release.json'); data=json.loads(rel.read_text())
          data.update({
            'versionName':'1.1.8','versionCode':11,
            'providerlessBackgroundNotifications':True,
            'providerlessBackgroundIntervalMinutes':15,
            'providerlessBackgroundTransport':'Supabase Edge Function + Capacitor Background Runner + Local Notifications',
            'nativeBackgroundPushRequires':[
              'Firebase Android google-services.json only for instant FCM delivery',
              'FCM HTTP v1 service-account credentials only for instant FCM delivery',
              'physical-device verification of both instant and providerless fallback delivery'
            ]
          })
          rel.write_text(json.dumps(data,indent=2)+'\n')
          req=Path('native/release-sign-request.json'); data=json.loads(req.read_text())
          data.update({'versionName':'1.1.8','versionCode':11,'requestedAt':'2026-10-25','reason':'Signed Play AAB with provider-independent Android background notifications and optional FCM instant delivery'})
          req.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Regenerate deterministic npm lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify dependency security
        run: |
          npm ci --ignore-scripts
          node scripts/dependency-security-audit.mjs
      - name: Verify release identity
        run: node -e "const r=require('./native/android-release.json'); if(r.versionName!=='1.1.8'||r.versionCode!==11||r.providerlessBackgroundNotifications!==true) process.exit(1)"
      - name: Commit generated lock and release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json native android/app/build.gradle scripts src/lib/runtimeTelemetry.ts docs/P9_P12_RELEASE_CANDIDATE_2026-09-30.md
          git commit -m "Finalize Android 1.1.8 release metadata and dependency lock"
          git push origin HEAD:feat/android-providerless-notifications
