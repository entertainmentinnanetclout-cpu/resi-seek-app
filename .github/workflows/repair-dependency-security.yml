name: Repair Dependency Security

on:
  push:
    branches: [upgrade/nsfas-compliance-meta-pixel]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Apply forced dependency security fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/nsfas-compliance-meta-pixel
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply forced npm security remediation
        run: npm audit fix --force

      - name: Require zero known vulnerabilities
        run: npm audit --audit-level=low

      - name: Verify strict TypeScript
        run: npx tsc --noEmit

      - name: Verify lint
        run: npm run lint

      - name: Verify production build
        run: npm run build

      - name: Commit verified dependency repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Apply forced dependency security fixes"
          git push origin HEAD:upgrade/nsfas-compliance-meta-pixel
