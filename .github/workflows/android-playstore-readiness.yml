name: Android Play Store Readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "native/**"
      - "capacitor.config.*"
      - "src/pages/Auth.tsx"
      - "src/pages/Privacy.tsx"
      - "src/pages/AccountDeletion.tsx"
      - "src/pages/Profile.tsx"
      - "src/pages/Dashboard.tsx"
      - "src/components/DashboardLayout.tsx"
      - "src/components/MyResKonnectCommandCentre.tsx"
      - "src/components/StudentRoute.tsx"
      - "src/contexts/AuthContext.tsx"
      - "src/components/SiteHeader.tsx"
      - "src/components/HomeJourneyBar.tsx"
      - "src/components/PushPrompt.tsx"
      - "src/lib/push.ts"
      - "src/main.tsx"
      - "vite.config.ts"
      - "index.html"
      - "supabase/config.toml"
      - "supabase/functions/push-subscription/**"
      - "supabase/functions/send-push/**"
      - "scripts/android-v110-reliability-qa.mjs"
      - "src/App.tsx"
      - "scripts/android-playstore-readiness.mjs"
      - ".github/workflows/android-playstore-*.yml"

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          packages: ""

      - name: Install Android 16 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Install locked web dependencies
        run: npm ci

      - name: Strict Android / Play audit
        run: node scripts/android-playstore-readiness.mjs --strict

      - name: Android / web reliability audit
        run: node scripts/android-v110-reliability-qa.mjs

      - name: Check complete application types
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Install browser regression runtime
        run: npx playwright install --with-deps chromium

      - name: Verify native login and session lifecycle
        run: node scripts/android-session-regression.mjs

      - name: Install pinned Capacitor toolchain without changing lockfile
        run: npm install --no-save --package-lock=false @capacitor/core@8.5.0 @capacitor/android@8.5.0 @capacitor/cli@8.5.0

      - name: Build production web bundle
        env:
          RK_NATIVE_BUILD: "1"
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Compile API 36 release AAB
        env:
          ANDROID_VERSION_CODE: "5"
          ANDROID_VERSION_NAME: "1.1.2"
        run: gradle -p android bundleRelease --stacktrace

      - name: Verify release artifact exists
        run: test -s android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload unsigned readiness AAB
        uses: actions/upload-artifact@v4
        with:
          name: reskonnect-android-readiness-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
