name: Synchronize Dependency Lock

on:
  push:
    branches: [upgrade/nsfas-compliance-meta-pixel]

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/nsfas-compliance-meta-pixel
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconcile package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install reconciled lock
        run: npm ci

      - name: Governed dependency security audit
        run: node scripts/dependency-security-audit.mjs

      - name: Strict TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified lock and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/sync-dependency-lock.yml
          git add package-lock.json .github/workflows/sync-dependency-lock.yml
          git commit -m "Finalize governed dependency security lock"
          git push origin HEAD:upgrade/nsfas-compliance-meta-pixel
