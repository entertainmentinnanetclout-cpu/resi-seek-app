name: Repair Dependency Security

on:
  push:
    branches: [upgrade/nsfas-compliance-meta-pixel]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Apply npm audit security fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/nsfas-compliance-meta-pixel
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking npm security fixes
        run: npm audit fix || true

      - name: Show remaining audit findings
        run: npm audit --audit-level=low || true

      - name: Verify TypeScript and build after dependency changes
        run: |
          npx tsc --noEmit
          npm run build

      - name: Commit dependency repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Apply npm audit security fixes"
          git push origin HEAD:upgrade/nsfas-compliance-meta-pixel
