name: AdminOS Release Gate

on:
  push:
    branches:
      - feat/dimpho-service-intelligence-release
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply final AdminOS wiring
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node scripts/finish-adminos-dimpho-release.mjs

      - name: Commit generated wiring
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet; then
            echo "No wiring changes required"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/admin/AdminOSWhatsAppDeskNext.tsx src/components/admin/AdminOSWhatsAppConcierge.tsx src/components/admin/AdminOSResidenceReadiness.tsx src/components/AutomationAdvantageSection.tsx src/pages/admin/AdminSystemHub.tsx
            git commit -m "feat(adminos): wire Dimpho service intelligence UI"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: TypeScript
        run: npx tsc --noEmit

      - name: SEO quality
        run: npm run seo:check

      - name: Production build
        run: npm run build

      - name: Dependency security
        run: npm audit --omit=dev --audit-level=high
