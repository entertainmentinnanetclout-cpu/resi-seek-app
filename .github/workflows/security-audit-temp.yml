name: Dependency Security Audit

on:
  push:
    branches:
      - fix/security-audit-mobile-reservation-popup

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit JSON
        run: npm audit --json > audit.json || true
      - name: Print audit report
        run: cat audit.json
      - name: Safe fix dry-run
        run: npm audit fix --dry-run || true
      - name: Outdated packages
        run: npm outdated || true
