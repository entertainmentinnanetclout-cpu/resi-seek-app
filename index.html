  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Cleanup legacy service worker registered at /sw.js (avoids stale cached source files)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((reg) => {
            if (reg.active?.scriptURL?.includes('/sw.js')) {
              reg.unregister().then(() => console.log('Legacy SW unregistered'));
            }
          });
        });
      }
    </script>
